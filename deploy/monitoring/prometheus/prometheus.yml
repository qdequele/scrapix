global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'scrapix-local'
    env: 'development'

rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrapix API server — GET /metrics on its normal HTTP port (PORT, 8080),
  # not a dedicated metrics port.
  - job_name: 'scrapix-api'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'

  # Scrapix Crawler Workers — GET /metrics on each machine's WAKE_PORT
  # (8081 by default). One target per machine/process, not per logical
  # service; add one line per worker instance you run locally.
  - job_name: 'scrapix-crawler-workers'
    static_configs:
      - targets:
          - 'host.docker.internal:8081'
    metrics_path: '/metrics'

  # Scrapix Content Workers — GET /metrics on each machine's WAKE_PORT.
  # If you run content workers on the same host as the crawler workers
  # above, give them a distinct WAKE_PORT (e.g. 8082) and list it here.
  - job_name: 'scrapix-content-workers'
    static_configs:
      - targets:
          - 'host.docker.internal:8082'
    metrics_path: '/metrics'

  # Scrapix Frontier Service — GET /metrics on its WAKE_PORT.
  - job_name: 'scrapix-frontier'
    static_configs:
      - targets: ['host.docker.internal:8083']
    metrics_path: '/metrics'

  # Kafka/Redpanda metrics (if using)
  - job_name: 'redpanda'
    static_configs:
      - targets: ['host.docker.internal:9644']
    metrics_path: '/public_metrics'

  # Meilisearch metrics
  - job_name: 'meilisearch'
    static_configs:
      - targets: ['host.docker.internal:7700']
    metrics_path: '/metrics'

  # Redis/DragonflyDB metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['host.docker.internal:6379']
    # Note: Redis exporter needed for full metrics

  # ClickHouse metrics (if using)
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['host.docker.internal:9363']
    metrics_path: '/metrics'
