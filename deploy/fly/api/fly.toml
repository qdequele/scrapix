# scrapix-api — HTTP API server.
# Image is pushed to GHCR by CI; deploys use `flyctl deploy --image ...`.

app = "scrapix-api"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

[env]
  RUST_LOG = "info"
  SCRAPIX_MODE = "hosted"
  # Secrets (`flyctl secrets set`, see deploy/fly/README.md) that the hosted
  # engine requires and refuses to start without:
  #   LAB_URL, LAB_EVENTS_SECRET, LAB_SERVICE_TOKEN (and DATABASE_URL: the
  #   engine's own database, not the Lab's)
