apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapix-worker-content
  namespace: scrapix
  labels:
    app.kubernetes.io/name: scrapix-worker-content
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: scrapix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scrapix-worker-content
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scrapix-worker-content
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: scrapix
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: content
          image: scrapix-worker-content:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: scrapix-config
            - secretRef:
                name: scrapix-secrets
          env:
            # Same mode as the API: crawl AI and vision OCR go through each
            # team's AI gateway, with the key the Lab serves (needs LAB_URL,
            # LAB_INSTANCE_ID and LAB_INSTANCE_SECRET, shared with the API).
            - name: SCRAPIX_MODE
              value: "hosted"
            - name: KAFKA_GROUP_ID
              value: "scrapix-content"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      restartPolicy: Always
