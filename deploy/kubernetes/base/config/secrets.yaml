apiVersion: v1
kind: Secret
metadata:
  name: scrapix-secrets
  namespace: scrapix
  labels:
    app.kubernetes.io/name: scrapix
type: Opaque
stringData:
  # REQUIRED: Set these in your overlay or via kubectl create secret
  MEILISEARCH_API_KEY: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  CLICKHOUSE_PASSWORD: "CHANGE_ME"
  # REQUIRED in hosted mode (the API refuses to start without them).
  # LAB_SERVICE_TOKEN is the token the Lab presents when it calls this
  # engine (>= 32 chars, `openssl rand -hex 32`), generated first and passed
  # to the Lab at mint time as CREDENTIAL=. LAB_INSTANCE_ID /
  # LAB_INSTANCE_SECRET are then printed by the Lab's
  # `bin/rails lab:hosted_engine:create ... CREDENTIAL=<LAB_SERVICE_TOKEN>`
  # (see deploy/kubernetes/README.md). Set them in your overlay or with kubectl.
  LAB_INSTANCE_ID: "CHANGE_ME"
  LAB_INSTANCE_SECRET: "CHANGE_ME"
  LAB_SERVICE_TOKEN: "CHANGE_ME"
  # Optional: API authentication key
  # API_KEY: "your-api-key-here"
  # Optional: OpenAI API key for AI enrichment
  # OPENAI_API_KEY: "your-openai-key-here"
