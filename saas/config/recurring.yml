# Recurring jobs (SolidQueue dispatcher). The scheduled_emails drain delivers
# engine-queued emails; production also prunes finished SolidQueue jobs.
default: &default
  drain_scheduled_emails:
    class: DrainScheduledEmailsJob
    schedule: every 30 seconds

development:
  <<: *default

test: {}

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
