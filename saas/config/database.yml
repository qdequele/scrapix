# The SaaS app shares the Scrapix Postgres database with the Rust services.
#
# Table ownership (SCR-85): Rails owns the write path for users, accounts,
# account_members, api_keys, account_invites, crawl_configs,
# meilisearch_engines, and transactions; the Rust engine reads them for
# auth/credit validation and owns jobs/events tables.
#
# `database_tasks: false` disables db:create/drop/migrate/schema against the
# shared database — the schema is currently owned by deploy/postgres/init.sql.
# This flips when Rails takes over schema management in a later phase.

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://scrapix:scrapix@localhost:5433/scrapix") %>
  database_tasks: false

# Contract tests run against a live backend + the shared dev database, so the
# Rails test environment points at the same place. Rails-native tests that
# need an isolated database can override with TEST_DATABASE_URL.
test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", ENV.fetch("DATABASE_URL", "postgres://scrapix:scrapix@localhost:5433/scrapix")) %>
  database_tasks: false

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database_tasks: false
