[package]
name = "scrapix-api"
description = "REST/GraphQL API server for Scrapix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "scrapix_api"
path = "src/lib.rs"

[[bin]]
name = "scrapix-api"
path = "src/main.rs"

[dependencies]
scrapix-core = { path = "../../crates/scrapix-core" }
scrapix-billing = { path = "../../crates/scrapix-billing" }
scrapix-auth = { path = "../../crates/scrapix-auth" }
scrapix-queue = { path = "../../crates/scrapix-queue" }
scrapix-storage = { path = "../../crates/scrapix-storage" }
scrapix-parser = { path = "../../crates/scrapix-parser" }
scrapix-extractor = { path = "../../crates/scrapix-extractor" }
scrapix-crawler = { path = "../../crates/scrapix-crawler", features = ["browser-cdp"] }
scrapix-ai = { path = "../../crates/scrapix-ai" }
scrapix-ocr = { path = "../../crates/scrapix-ocr" }

# Config validation (CrawlConfig::validate())
validator = { workspace = true }

# HTTP client for /scrape endpoint
reqwest = { workspace = true }
scraper = { workspace = true }

tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

# Web framework (multipart: POST /parse uploads)
axum = { workspace = true, features = ["multipart"] }
tower-http = { workspace = true }

# Utilities
base64 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
time = { workspace = true }

# CLI
clap = { workspace = true }

# Async utilities
parking_lot = { workspace = true }
tokio-stream = { workspace = true }

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Async traits
async-trait = { workspace = true }

# Credential validation (API keys, OAuth Bearer tokens, session JWTs)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "uuid", "chrono", "tls-rustls", "migrate"] }
sha2 = "0.10"
hex = "0.4"
axum-extra = { version = "0.10", features = ["cookie"] }
subtle = "2.6"

hmac = "0.12"

# OpenAPI
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }

[dev-dependencies]
wiremock = { workspace = true }
tower = { workspace = true }
tempfile = "3"
jsonschema = { version = "0.45", default-features = false }
