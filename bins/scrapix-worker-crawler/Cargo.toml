[package]
name = "scrapix-worker-crawler"
description = "Crawler worker for fetching web pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "scrapix_worker_crawler"
path = "src/lib.rs"

[[bin]]
name = "scrapix-worker-crawler"
path = "src/main.rs"

[features]
default = []
browser = ["scrapix-crawler/browser-cdp", "scrapix-crawler/browser-lightpanda"]
# `mimalloc`: use mimalloc as the binary's global allocator (set in
# `src/main.rs`). Off by default: build with `--features mimalloc`. It is
# faster on parsing (8 to 10% on Linux) but doubles the content worker's
# peak memory, with no gain in crawl throughput end to end.
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { workspace = true, optional = true }
scrapix-core = { path = "../../crates/scrapix-core" }
scrapix-crawler = { path = "../../crates/scrapix-crawler" }
# PDF link extraction (`features.pdf.extract_links`)
scrapix-parser = { path = "../../crates/scrapix-parser" }
scrapix-frontier = { path = "../../crates/scrapix-frontier" }
scrapix-lifecycle = { path = "../../crates/scrapix-lifecycle" }
scrapix-queue = { path = "../../crates/scrapix-queue" }
scrapix-storage = { path = "../../crates/scrapix-storage" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
parking_lot = { workspace = true }

base64 = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
