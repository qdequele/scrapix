[package]
name = "scrapix"
description = "Unified Scrapix binary — run individual services or all-in-one"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "scrapix"
path = "src/main.rs"

[features]
default = ["mimalloc"]
browser = ["scrapix-worker-crawler/browser"]
# `mimalloc`: use mimalloc as the binary's global allocator (set in
# `src/main.rs`). On by default; build with `--no-default-features` for the
# system allocator.
mimalloc = ["dep:mimalloc"]

[dependencies]
# The service crates are used as libraries here: their own `mimalloc`
# feature only concerns their standalone binaries.
scrapix-api = { path = "../scrapix-api", default-features = false }
scrapix-worker-crawler = { path = "../scrapix-worker-crawler", default-features = false }
scrapix-worker-content = { path = "../scrapix-worker-content", default-features = false }
scrapix-frontier-service = { path = "../scrapix-frontier-service", default-features = false }
scrapix-cli = { path = "../scrapix-cli", default-features = false }
scrapix-queue = { path = "../../crates/scrapix-queue" }
mimalloc = { workspace = true, optional = true }

tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tempfile = "3"
