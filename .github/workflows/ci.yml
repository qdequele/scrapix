name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bins/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'sdks/**'
      - 'contracts/**'
      - 'justfile'
      - '.github/workflows/ci.yml'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all -- -D warnings


  # ---------------------------------------------------------------------------
  # SDKs (sdks/typescript, sdks/python)
  # ---------------------------------------------------------------------------

  sdk-drift:
    name: SDK generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: sdks/generate.sh --check

  sdk-typescript:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sdk-python:
    name: SDK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --group dev ruff check .
      - run: uv run --group dev ruff format --check .
      - run: uv run --group dev mypy
      - run: uv run --group dev pytest
      # Oldest supported dependency versions (httpx 0.23, pydantic 2.0, anyio 3.5)
      - if: matrix.python == '3.9'
        run: uv run --group dev --resolution lowest-direct pytest
      - run: uv build

  # ---------------------------------------------------------------------------
  # Contracts vendored from meilisearch/lab (skips without LAB_REPO_TOKEN)
  # ---------------------------------------------------------------------------

  contracts:
    name: Lab contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: contracts/check-drift.sh
        env:
          GH_TOKEN: ${{ secrets.LAB_REPO_TOKEN }}
