name: Release

# Minimal engine release, run on a `vX.Y.Z` tag. release-on-merge.yml calls it
# when a `chore(release): vX.Y.Z` PR merges (see CLAUDE.md, "Versioning,
# releases and deployment"); a tag pushed by hand runs it too (recovery only).
#
# 1. images: one image per engine role, from the Dockerfile's targets, pushed
#    to GHCR as `ghcr.io/qdequele/<target>:vX.Y.Z` and `:latest` (the names
#    deploy/kubernetes/overlays/prod expects). linux/amd64 only: an emulated
#    arm64 build of this workspace takes hours.
# 2. release: the GitHub release, with the tag's CHANGELOG section as notes.
#    Created after the images, so a published release always has them.
# 3. notify-lab: repository_dispatch `scrapix-released` to meilisearch/lab, so
#    its Contracts sync re-vendors contracts/openapi.json now instead of at its
#    daily run. Skipped without the LAB_DISPATCH_TOKEN secret.
#
# No test gate here: the release commit's CI ran on the release PR (dispatched
# by prepare-release.yml) and on main. Production does not deploy from these
# artifacts: the Lab's box builds every green `main` commit from source
# (qdq-server platform/autodeploy.sh).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_call:
    inputs:
      tag:
        description: "The vX.Y.Z tag to release (already pushed)"
        type: string
        required: true

permissions:
  contents: write # create the release
  packages: write # push the images to GHCR

env:
  # The tag being released: the pushed tag, or the caller's input.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  images:
    name: role images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The release notes must exist before anything is pushed.
      - name: Check the CHANGELOG has this version
        run: scripts/prepare-release.sh --notes "$RELEASE_TAG" >/dev/null

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One builder for the four targets: the shared `builder` stage compiles
      # once and the other targets reuse it from the local build cache.
      - name: Build and push the role images
        run: |
          for target in scrapix-api scrapix-frontier-service scrapix-worker-crawler scrapix-worker-content; do
            image="ghcr.io/qdequele/$target"
            echo "::group::$target"
            docker buildx build --platform linux/amd64 --target "$target" \
              -t "$image:$RELEASE_TAG" -t "$image:latest" --push .
            echo "::endgroup::"
            echo "- \`$image:$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          done

  release:
    name: GitHub release with CHANGELOG notes
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::release $RELEASE_TAG already exists; leaving it as is"
            exit 0
          fi
          {
            scripts/prepare-release.sh --notes "$RELEASE_TAG"
            echo
            echo "Images (linux/amd64): \`ghcr.io/qdequele/{scrapix-api,scrapix-frontier-service,scrapix-worker-crawler,scrapix-worker-content}:$RELEASE_TAG\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"

  # A failed dispatch never fails a published release: the Lab's daily
  # Contracts sync catches up anyway.
  notify-lab:
    name: notify the Lab
    runs-on: ubuntu-latest
    needs: release
    permissions: {}
    steps:
      - name: Send repository_dispatch scrapix-released to meilisearch/lab
        env:
          LAB_DISPATCH_TOKEN: ${{ secrets.LAB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$LAB_DISPATCH_TOKEN" ]; then
            echo "::notice::LAB_DISPATCH_TOKEN is not set; skipping the Lab notification (its daily contracts run will pick up $RELEASE_TAG)"
            exit 0
          fi
          payload=$(printf '{"event_type":"scrapix-released","client_payload":{"tag":"%s","version":"%s"}}' "$RELEASE_TAG" "${RELEASE_TAG#v}")
          code=$(curl -sS -o "$RUNNER_TEMP/dispatch.out" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $LAB_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/meilisearch/lab/dispatches -d "$payload" || true)
          if [ "$code" = "204" ]; then
            echo "notified meilisearch/lab of $RELEASE_TAG"
          else
            echo "::warning::could not notify meilisearch/lab (HTTP ${code:-none}): $(head -c 300 "$RUNNER_TEMP/dispatch.out" 2>/dev/null)"
          fi
